version: 1
nodes:
  - name: root
    label: Moteur BLDC & onduleur
    description: 'Composant réutilisable : moteur à entraînement direct et son onduleur.'
    readonly: false
    objectTypes:
      - name: exigence-moteur
        label: Exigence Moteur
        prefix: MOT
        category: requirement
        fields:
          - &ref_0
            name: statement
            label: Énoncé (EARS)
            type: richtext
            validator: EARS
            required: true
          - name: priority
            label: Priorité
            type: enum
            values: &ref_1
              - high
              - medium
              - low
            required: true
            default: medium
            trackHistory: true
          - &ref_2
            name: securite
            label: Exigence de sécurité
            type: boolean
            default: false
          - name: couple_nm
            label: Couple (N·m)
            type: number
          - name: acceptanceCriteria
            label: Critères d'acceptance
            type: richtext
        statuses: &ref_3
          - name: draft
            label: Brouillon
            color: '#475569'
          - name: review
            label: En review
            color: '#b45309'
          - name: approved
            label: Approuvé
            color: '#16a34a'
            isApproval: true
          - name: obsolete
            label: Obsolète
            color: '#6b7280'
            isTerminal: true
      - name: test-moteur
        label: Test Moteur
        prefix: TMOT
        category: test
        fields:
          - name: banc
            label: Banc moteur
            type: enum
            values:
              - Banc dynamométrique
              - Banc thermique
              - Banc HIL
        statuses:
          - name: draft
            label: Brouillon
            color: '#475569'
          - name: review
            label: En review
            color: '#b45309'
          - name: approved
            label: Approuvé
            color: '#16a34a'
            isApproval: true
          - name: obsolete
            label: Obsolète
            color: '#6b7280'
            isTerminal: true
      - name: campagne-moteur
        label: Campagne Moteur
        prefix: CMOT
        category: campaign
        fields:
          - name: lieu
            label: Lieu d'essai
            type: text
      - name: version
        label: Version
        prefix: MOTV
        category: version
        fields:
          - name: description
            label: Description
            type: richtext
        statuses:
          - name: en_cours
            label: En cours
            color: '#2563eb'
          - name: released
            label: Released
            color: '#16a34a'
            isApproval: true
          - name: abandonnee
            label: Abandonnée
            color: '#6b7280'
            isTerminal: true
      - name: issue
        label: Issue
        prefix: MISS
        category: issue
        fields:
          - name: gravite
            label: Gravité
            type: enum
            values:
              - mineure
              - majeure
              - bloquante
          - name: description
            label: Description
            type: richtext
        statuses:
          - name: ouverte
            label: Ouverte
            color: '#b45309'
          - name: en_cours
            label: En cours
            color: '#2563eb'
          - name: corrigee
            label: Corrigée
            color: '#16a34a'
          - name: rejetee
            label: Rejetée
            color: '#6b7280'
            isTerminal: true
      - name: validation
        label: Validation
        prefix: VMOT
        category: validation
        fields: []
        statuses:
          - name: en_cours
            label: En cours
            color: '#2563eb'
          - name: signee
            label: Signée
            color: '#16a34a'
            isApproval: true
          - name: annulee
            label: Annulée
            color: '#6b7280'
            isTerminal: true
        decisions:
          - name: en_attente
            label: En attente
            isPending: true
          - name: conforme
            label: Conforme
          - name: non_conforme
            label: Non conforme
            proposesIssue: true
          - name: hors_scope
            label: Hors scope
          - name: derogation
            label: Dérogation
            proposesIssue: true
    children:
      - name: firmware-moteur
        label: Firmware FOC
        readonly: false
        objectTypes:
          - name: exigence-fw-moteur
            label: Exigence Firmware moteur
            prefix: FWM
            category: requirement
            fields:
              - *ref_0
              - name: priority
                label: Priorité
                type: enum
                values: *ref_1
                required: true
                default: medium
              - *ref_2
            statuses: *ref_3
    implements:
      - interface: if-bus-interne
        roles:
          - device
implements:
  - interface: if-bus-interne
    roles:
      - device
linkTypes:
  - name: implementation
    labelSourceToTarget: est implémentée par
    labelTargetToSource: implémente
    sourceRefs:
      - requirement
    targetRefs:
      - requirement
  - name: verification
    labelSourceToTarget: vérifie
    labelTargetToSource: est vérifiée par
    sourceRefs:
      - test
    targetRefs:
      - requirement
    defaultVisible: true
  - name: implements-interface
    labelSourceToTarget: implémente l'exigence d'interface
    labelTargetToSource: est implémentée (interface) par
    sourceRefs:
      - requirement
    targetRefs:
      - requirement
  - name: issue-impact
    labelSourceToTarget: impacte
    labelTargetToSource: est impactée par
    sourceRefs:
      - issue
    targetRefs:
      - requirement
    defaultVisible: true
